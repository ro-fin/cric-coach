[project]
name = "cricai-data"
version = "0.1.0"
description = "Canonical schemas, enums, synthetic data and storage adapters for the AI cricket lab"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricai_data"]
