[project]
name = "cricai-coaching"
version = "0.1.0"
description = "Rules engine, workload safety, agents and reports for the AI cricket lab"
requires-python = ">=3.12"
dependencies = [
    "cricai-data",
    "cricai-vision",
]

[tool.uv.sources]
cricai-data = { workspace = true }
cricai-vision = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricai_coaching"]
