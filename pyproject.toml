[project]
name = "cricai-workspace"
version = "0.1.0"
description = "AI cricket lab — home coaching system (workspace root)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/data",
    "packages/vision",
    "packages/coaching",
    "apps/api",
    "apps/worker",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "scripts", "testsupport"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "C4", "RET", "ARG"]
ignore = ["PLR2004"]  # magic-value comparisons are fine in domain constants/tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR0913", "ARG001"]
"**/routers/**" = ["PLR0913"]  # FastAPI endpoints: params are the contract
"**/alembic/versions/**" = ["E501", "W291"]  # autogenerated migrations

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = [
    "packages/data/src",
    "packages/vision/src",
    "packages/coaching/src",
    "apps/api/src",
    "apps/worker/src",
    "testsupport",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["packages", "apps"]
pythonpath = ["testsupport"]
norecursedirs = ["node_modules", ".next", ".venv", "datasets", "models"]
markers = [
    "integration: uses real services (postgres, redis, ffmpeg, minio)",
    "safety: SAF suite — release-gating, never waivable",
    "golden: golden-session end-to-end snapshots",
]
asyncio_mode = "auto"
