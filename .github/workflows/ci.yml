name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, typecheck, unit (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages apps/api/src apps/worker/src scripts
      # Phase 8: the checked-in OpenAPI dump the dashboard contract test pins to.
      - run: uv run scripts/dump_openapi.py --check
      - run: make test-unit

  python-integration:
    name: Python — integration, safety, golden
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cricai
          POSTGRES_PASSWORD: cricai
          POSTGRES_DB: cricai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cricai" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CRICAI_TEST_DATABASE_URL: postgresql+psycopg://cricai:cricai@localhost:5432/cricai_test
      CRICAI_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --all-packages
      - run: uv run pytest -m integration
      - run: uv run pytest -m safety
      - run: uv run pytest -m golden

  web:
    name: Web — lint, typecheck, test (100% coverage), build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter cricai-web lint
      - run: pnpm --filter cricai-web typecheck
      - run: pnpm --filter cricai-web test
      - run: pnpm --filter cricai-web build

  web-e2e:
    name: Web — end-to-end journeys (Playwright, production build)
    # Phase 8. Not yet a merge gate: it boots the whole stack (real API on
    # SQLite + seeded demo + `next build` + `next start`) and needs the rig UAT
    # before it is trusted to block. Promote by adding it to branch protection.
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter cricai-web exec playwright install --with-deps chromium
      - run: pnpm --filter cricai-web e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: .cricai-run/e2e/
          retention-days: 7
